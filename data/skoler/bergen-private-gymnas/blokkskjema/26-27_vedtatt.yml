# ========================================
# VALGREGLER PER PROGRAMOMRADE
# ========================================
valgregler:
  # =====================================
  # STUDIESPESIALISERING
  # =====================================
  studiespesialisering:
    vg2:
      beskrivelse: "VG2 Studiespesialisering: Velg 3 programfag + matematikk"
      tilgjengeligeBlokker: ["blokk1", "blokk2", "blokk3", "blokk4"]
      minAntallFag: 3
      maxAntallFag: 3

      krav:
        - type: "minimum-timer-uten-matte"
          timer: 420
          beskrivelse: "Totalt 420 timer programfag (ikke medregnet matematikk)"
          feilmelding: "Du ma velge 3 programfag (420 timer) i tillegg til matematikk"

        - type: "matematikk-obligatorisk"
          beskrivelse: "Du MA velge enten Matematikk 2P, R1 eller S1"
          feilmelding: "Du ma velge matematikk: enten 2P, R1 eller S1"
          valg:
            - id: "matematikk-2p"
              timer: 84
              type: "fellesfag"
            - id: "matematikk-r1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"
            - id: "matematikk-s1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"

      infomeldinger:
        - "Velg 3 programfag (420 timer) + matematikk"
        - "Matematikk: Velg enten 2P (84t), R1 (140t) eller S1 (140t)"
        - "Du bor planlegge for fordypning (to fag fra samme fagomrade)"

    vg3:
      beskrivelse: "VG3 Studiespesialisering: Velg 3 programfag + Historie (4 fag totalt)"
      tilgjengeligeBlokker: ["blokk1", "blokk2", "blokk3", "blokk4"]
      minAntallFag: 4
      maxAntallFag: 4

      krav:
        - type: "minimum-timer"
          timer: 420
          beskrivelse: "Totalt 420 timer programfag"

        - type: "obligatorisk-fag"
          fagId: "historie-vg3"
          beskrivelse: "Historie VG3 er obligatorisk"
          feilmelding: "Du ma velge Historie VG3"

        - type: "fordypning-krav"
          beskrivelse: "Du ma ha fordypning i to fagomrader"
          minimer: 280
          fagtype: "fordypning-niva-2"

        - type: "spansk-betinget"
          fagId: "spansk-i-ii"
          betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

      infomeldinger:
        - "Velg 3 programfag + Historie (obligatorisk)"
        - "Du ma ha fordypning: 2 fagomrader med niva 1+2"
        - "Hvis du ikke hadde fremmedsprak pa ungdomsskolen, ma du velge Spansk I+II"

  # =====================================
  # MUSIKK, DANS OG DRAMA
  # =====================================
  musikk-dans-drama:
    vg2:
      beskrivelse: "VG2 Musikk: Velg 1 valgfritt programfag + matematikk"
      tilgjengeligeBlokker: ["blokk1", "blokk3"]
      minAntallFag: 1
      maxAntallFag: 1

      krav:
        - type: "minimum-timer-uten-matte"
          timer: 140
          beskrivelse: "Totalt 140 timer valgfritt programfag"
          feilmelding: "Du ma velge 1 valgfritt programfag (140 timer)"

        - type: "matematikk-obligatorisk"
          beskrivelse: "Du MA velge enten Matematikk 2P, R1 eller S1"
          feilmelding: "Du ma velge matematikk"
          valg:
            - id: "matematikk-2p"
              timer: 84
              type: "fellesfag"
            - id: "matematikk-r1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"
            - id: "matematikk-s1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"

      infomeldinger:
        - "Velg 1 valgfritt programfag (140 timer) + matematikk"

    vg3:
      beskrivelse: "VG3 Musikk: Velg 2 programfag (1 valgfritt + Historie)"
      tilgjengeligeBlokker: ["blokk2", "blokk4"]
      minAntallFag: 2
      maxAntallFag: 2

      krav:
        - type: "minimum-timer"
          timer: 253
          beskrivelse: "Totalt 253 timer (140t valgfritt + 113t historie)"

        - type: "obligatorisk-fag"
          fagId: "historie-vg3"
          beskrivelse: "Historie VG3 er obligatorisk"
          feilmelding: "Du ma velge Historie VG3"

        - type: "spansk-betinget"
          fagId: "spansk-i-ii"
          betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

      infomeldinger:
        - "Velg 1 valgfritt programfag + Historie (obligatorisk)"
        - "Hvis du ikke hadde fremmedsprak pa ungdomsskolen, ma du velge Spansk I+II"

  # =====================================
  # MEDIER OG KOMMUNIKASJON
  # =====================================
  medier-kommunikasjon:
    vg2:
      beskrivelse: "VG2 Medier: Velg 1 valgfritt programfag + matematikk"
      tilgjengeligeBlokker: ["blokk1", "blokk3"]
      minAntallFag: 1
      maxAntallFag: 1

      krav:
        - type: "minimum-timer-uten-matte"
          timer: 140
          beskrivelse: "Totalt 140 timer valgfritt programfag"
          feilmelding: "Du ma velge 1 valgfritt programfag (140 timer)"

        - type: "matematikk-obligatorisk"
          beskrivelse: "Du MA velge enten Matematikk 2P, R1 eller S1"
          feilmelding: "Du ma velge matematikk"
          valg:
            - id: "matematikk-2p"
              timer: 84
              type: "fellesfag"
            - id: "matematikk-r1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"
            - id: "matematikk-s1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"

      infomeldinger:
        - "Velg 1 valgfritt programfag (140 timer) + matematikk"

    vg3:
      beskrivelse: "VG3 Medier: Velg 3 programfag (2 valgfrie + Historie)"
      tilgjengeligeBlokker: ["blokk2", "blokk3", "blokk4"]
      minAntallFag: 3
      maxAntallFag: 3

      krav:
        - type: "minimum-timer"
          timer: 393
          beskrivelse: "Totalt 393 timer (280t valgfrie + 113t historie)"

        - type: "obligatorisk-fag"
          fagId: "historie-vg3"
          beskrivelse: "Historie VG3 er obligatorisk"
          feilmelding: "Du ma velge Historie VG3"

        - type: "spansk-betinget"
          fagId: "spansk-i-ii"
          betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

      infomeldinger:
        - "Velg 2 valgfrie programfag + Historie (obligatorisk)"
        - "Hvis du ikke hadde fremmedsprak pa ungdomsskolen, ma du velge Spansk I+II"

# ========================================
# FORUTSETNINGER OG EKSKLUSJONER
# ========================================
regler:
  forutsetninger:
    - fag: "matematikk-r2"
      krever: ["matematikk-r1"]
      beskrivelse: "Matematikk R2 krever R1"
      feilmelding: "For a velge Matematikk R2 ma du ha hatt R1"

    - fag: "matematikk-s2"
      krever: ["matematikk-s1"]
      beskrivelse: "Matematikk S2 krever S1"
      feilmelding: "For a velge Matematikk S2 ma du ha hatt S1"

    - fag: "fysikk-2"
      krever: ["fysikk-1"]
      beskrivelse: "Fysikk 2 krever Fysikk 1"
      feilmelding: "For a velge Fysikk 2 ma du ha hatt Fysikk 1"

    - fag: "kjemi-2"
      krever: ["kjemi-1"]
      beskrivelse: "Kjemi 2 krever Kjemi 1"
      feilmelding: "For a velge Kjemi 2 ma du ha hatt Kjemi 1"

    - fag: "markedsforing-og-ledelse-2"
      krever: ["markedsforing-og-ledelse-1"]
      beskrivelse: "Markedsforing og ledelse 2 krever niva 1"
      feilmelding: "For a velge Markedsforing og ledelse 2 ma du ha hatt niva 1"

  eksklusjoner:
    - gruppe: ["matematikk-r1", "matematikk-r2", "matematikk-2p"]
      beskrivelse: "Kan ikke kombinere R-matte og 2P-matte"
      feilmelding: "Du kan ikke kombinere R-matematikk med 2P"

    - gruppe: ["matematikk-s1", "matematikk-s2", "matematikk-2p"]
      beskrivelse: "Kan ikke kombinere S-matte og 2P-matte"
      feilmelding: "Du kan ikke kombinere S-matematikk med 2P"

    - gruppe: ["matematikk-r1", "matematikk-r2", "matematikk-s1", "matematikk-s2"]
      beskrivelse: "Kan ikke kombinere R-matte og S-matte"
      feilmelding: "Du kan ikke kombinere R-matematikk med S-matematikk"

  erstatter:
    - fag: "matematikk-r1"
      erstatter: "matematikk-2p"
      beskrivelse: "Matematikk R1 erstatter 2P"
