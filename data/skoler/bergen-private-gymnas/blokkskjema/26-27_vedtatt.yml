# Bergen Private Gymnas - Blokkskjema 2026-2027 (Vedtatt)
# Sist oppdatert: 2026-01-08
# Basert på blokkskjema.xlsx fra skolen
#
# VIKTIGE PRINSIPPER:
# - Fag med * krever forutsetningsfag
# - Fag med ** er betinget obligatorisk (Spansk I+II)
# - Historie VG3 er obligatorisk fellesfag (håndteres separat, ikke i blokkskjema)
# - Blokk 1 VG3: Kun R2/S2 - elever som ikke velger dette har 3 blokker

school: bergen-private-gymnas
versjon: "26-27_vedtatt"

# ========================================
# STRUKTUR
# ========================================
struktur:
  antallBlokker: 4
  navnBlokker:
    - "Blokk 1"
    - "Blokk 2"
    - "Blokk 3"
    - "Blokk 4"

# ========================================
# BLOKKER - VALGFRIE PROGRAMFAG
# ========================================
blokker:
  # =====================================
  # BLOKK 1
  # VG2: Alle (Stud, Musikk, MK)
  # VG3: Kun Stud - kun R2/S2 tilgjengelig (valgfritt)
  # =====================================
  blokk1:
    navn: "Blokk 1"
    beskrivelse: "Matematikk"
    tilgjengeligFor:
      vg2: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
      vg3: ["studiespesialisering"]

    fag:
      # ===== VG2 FAG =====
      - id: matematikk-2p
        timer: 84
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Fellesfag som kan erstattes av R1 eller S1"

      - id: matematikk-s1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Erstatter Matematikk 2P hvis valgt"

      - id: matematikk-r1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Erstatter Matematikk 2P hvis valgt"

      # ===== VG3 FAG =====
      # Kun R2/S2 for Studiespesialisering
      - id: matematikk-r2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]
        krever: ["matematikk-r1"]

      - id: matematikk-s2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]
        krever: ["matematikk-s1"]

  # =====================================
  # BLOKK 2
  # VG2: Kun Studiespesialisering
  # VG3: Alle (Stud, Musikk, MK)
  # =====================================
  blokk2:
    navn: "Blokk 2"
    beskrivelse: "Realfag, Økonomi, Samfunnsfag, Kunst"
    tilgjengeligFor:
      vg2: ["studiespesialisering"]
      vg3: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

    fag:
      # ===== VG2 FAG =====
      - id: kjemi-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: rettslaere-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: okonomistyring
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: samfunnsokonomi-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: grafisk-design
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: grafisk-design
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

      # ===== VG3 FAG =====
      - id: psykologi-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Bygger ikke på Psykologi 1"

      - id: entreprenorskap-og-bedriftsutvikling-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Bygger ikke på Entreprenorskap 1"

      - id: musikk-fordypning-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Bygger ikke på Musikk fordypning 1"

      # ===== VG3 FAG MED FORUTSETNING =====
      - id: fysikk-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        krever: ["fysikk-1"]

      # ===== SPANSK I+II (betinget obligatorisk) =====
      - id: spansk-i-ii
        fagkode: FSP6237
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "BETINGET OBLIGATORISK for elever uten fremmedsprak fra ungdomsskolen"
        betingetObligatorisk: true
        betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

  # =====================================
  # BLOKK 3
  # VG2: Alle (Stud, Musikk, MK)
  # VG3: Stud og MK (ikke Musikk)
  # =====================================
  blokk3:
    navn: "Blokk 3"
    beskrivelse: "Realfag, Bedriftsledelse, Samfunnsfag, Musikk, Kunst"
    tilgjengeligFor:
      vg2: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
      vg3: ["studiespesialisering", "medier-kommunikasjon"]

    fag:
      # ===== VG2 FAG =====
      - id: fysikk-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

      - id: entreprenorskap-og-bedriftsutvikling-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

      - id: psykologi-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

      - id: engelsk-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

      - id: musikk-fordypning-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

      - id: bilde
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

      - id: bilde
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "medier-kommunikasjon"]

      # ===== VG3 FAG =====
      - id: biologi-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "medier-kommunikasjon"]
        merknad: "Bygger ikke pa Biologi 1"

      - id: politikk-og-menneskerettigheter
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "medier-kommunikasjon"]

      - id: sosialkunnskap
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "medier-kommunikasjon"]

      # ===== VG3 FAG MED FORUTSETNING =====
      - id: markedsforing-og-ledelse-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "medier-kommunikasjon"]
        krever: ["markedsforing-og-ledelse-1"]

  # =====================================
  # BLOKK 4
  # VG2: Kun Studiespesialisering
  # VG3: Kun Studiespesialisering
  # =====================================
  blokk4:
    navn: "Blokk 4"
    beskrivelse: "Realfag, Økonomi, Samfunnsfag"
    tilgjengeligFor:
      vg2: ["studiespesialisering"]
      vg3: ["studiespesialisering"]

    fag:
      # ===== VG2 FAG =====
      - id: biologi-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: sosiologi-og-sosialantropologi
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: markedsforing-og-ledelse-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      # ===== VG3 FAG =====
      - id: okonomi-og-ledelse
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]

      - id: rettslaere-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]
        merknad: "Bygger ikke pa Rettslaere 1"

      # ===== VG3 FAG MED FORUTSETNING =====
      - id: kjemi-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]
        krever: ["kjemi-1"]

# ========================================
# VALGREGLER PER PROGRAMOMRADE
# ========================================
valgregler:
  # =====================================
  # STUDIESPESIALISERING
  # =====================================
  studiespesialisering:
    vg2:
      beskrivelse: "VG2 Studiespesialisering: Velg 3 programfag + matematikk"
      tilgjengeligeBlokker: ["blokk1", "blokk2", "blokk3", "blokk4"]
      minAntallFag: 3
      maxAntallFag: 3

      krav:
        - type: "minimum-timer-uten-matte"
          timer: 420
          beskrivelse: "Totalt 420 timer programfag (ikke medregnet matematikk)"
          feilmelding: "Du ma velge 3 programfag (420 timer) i tillegg til matematikk"

        - type: "matematikk-obligatorisk"
          beskrivelse: "Du MA velge enten Matematikk 2P, R1 eller S1"
          feilmelding: "Du ma velge matematikk: enten 2P, R1 eller S1"
          valg:
            - id: "matematikk-2p"
              timer: 84
              type: "fellesfag"
            - id: "matematikk-r1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"
            - id: "matematikk-s1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"

      infomeldinger:
        - "Velg 3 programfag (420 timer) + matematikk"
        - "Matematikk: Velg enten 2P (84t), R1 (140t) eller S1 (140t)"
        - "Du bor planlegge for fordypning (to fag fra samme fagomrade)"

    vg3:
      beskrivelse: "VG3 Studiespesialisering: Velg 3 valgfrie programfag"
      tilgjengeligeBlokker: ["blokk1", "blokk2", "blokk3", "blokk4"]
      minAntallFag: 3
      maxAntallFag: 3

      krav:
        - type: "minimum-timer"
          timer: 420
          beskrivelse: "Totalt 420 timer programfag"

        - type: "fordypning-krav"
          beskrivelse: "Du ma ha fordypning i to fagomrader"
          minimer: 280
          fagtype: "fordypning-niva-2"

        - type: "spansk-betinget"
          fagId: "spansk-i-ii"
          betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

      infomeldinger:
        - "Velg 3 valgfrie programfag (420 timer)"
        - "Blokk 1 har kun R2/S2 - elever uten disse velger fra blokk 2-4"
        - "Du ma ha fordypning: 2 fagomrader med niva 1+2"
        - "Hvis du ikke hadde fremmedsprak pa ungdomsskolen, ma du velge Spansk I+II"

  # =====================================
  # MUSIKK, DANS OG DRAMA
  # =====================================
  musikk-dans-drama:
    vg2:
      beskrivelse: "VG2 Musikk: Velg 1 valgfritt programfag + matematikk"
      tilgjengeligeBlokker: ["blokk1", "blokk3"]
      minAntallFag: 1
      maxAntallFag: 1

      krav:
        - type: "minimum-timer-uten-matte"
          timer: 140
          beskrivelse: "Totalt 140 timer valgfritt programfag"
          feilmelding: "Du ma velge 1 valgfritt programfag (140 timer)"

        - type: "matematikk-obligatorisk"
          beskrivelse: "Du MA velge enten Matematikk 2P, R1 eller S1"
          feilmelding: "Du ma velge matematikk"
          valg:
            - id: "matematikk-2p"
              timer: 84
              type: "fellesfag"
            - id: "matematikk-r1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"
            - id: "matematikk-s1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"

      infomeldinger:
        - "Velg 1 valgfritt programfag (140 timer) + matematikk"

    vg3:
      beskrivelse: "VG3 Musikk: Velg 1 valgfritt programfag"
      tilgjengeligeBlokker: ["blokk2"]
      minAntallFag: 1
      maxAntallFag: 1

      krav:
        - type: "minimum-timer"
          timer: 140
          beskrivelse: "Totalt 140 timer valgfritt programfag"

        - type: "spansk-betinget"
          fagId: "spansk-i-ii"
          betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

      infomeldinger:
        - "Velg 1 valgfritt programfag (140 timer) fra blokk 2"
        - "Hvis du ikke hadde fremmedsprak pa ungdomsskolen, ma du velge Spansk I+II"

  # =====================================
  # MEDIER OG KOMMUNIKASJON
  # =====================================
  medier-kommunikasjon:
    vg2:
      beskrivelse: "VG2 Medier: Velg 1 valgfritt programfag + matematikk"
      tilgjengeligeBlokker: ["blokk1", "blokk3"]
      minAntallFag: 1
      maxAntallFag: 1

      krav:
        - type: "minimum-timer-uten-matte"
          timer: 140
          beskrivelse: "Totalt 140 timer valgfritt programfag"
          feilmelding: "Du ma velge 1 valgfritt programfag (140 timer)"

        - type: "matematikk-obligatorisk"
          beskrivelse: "Du MA velge enten Matematikk 2P, R1 eller S1"
          feilmelding: "Du ma velge matematikk"
          valg:
            - id: "matematikk-2p"
              timer: 84
              type: "fellesfag"
            - id: "matematikk-r1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"
            - id: "matematikk-s1"
              timer: 140
              type: "programfag"
              erstatter: "matematikk-2p"

      infomeldinger:
        - "Velg 1 valgfritt programfag (140 timer) + matematikk"

    vg3:
      beskrivelse: "VG3 Medier: Velg 2 valgfrie programfag"
      tilgjengeligeBlokker: ["blokk2", "blokk3"]
      minAntallFag: 2
      maxAntallFag: 2

      krav:
        - type: "minimum-timer"
          timer: 280
          beskrivelse: "Totalt 280 timer valgfrie programfag"

        - type: "spansk-betinget"
          fagId: "spansk-i-ii"
          betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

      infomeldinger:
        - "Velg 2 valgfrie programfag (280 timer) fra blokk 2 og 3"
        - "Hvis du ikke hadde fremmedsprak pa ungdomsskolen, ma du velge Spansk I+II"

# ========================================
# FORUTSETNINGER OG EKSKLUSJONER
# ========================================
regler:
  forutsetninger:
    - fag: "matematikk-r2"
      krever: ["matematikk-r1"]
      beskrivelse: "Matematikk R2 krever R1"
      feilmelding: "For a velge Matematikk R2 ma du ha hatt R1"

    - fag: "matematikk-s2"
      krever: ["matematikk-s1"]
      beskrivelse: "Matematikk S2 krever S1"
      feilmelding: "For a velge Matematikk S2 ma du ha hatt S1"

    - fag: "fysikk-2"
      krever: ["fysikk-1"]
      beskrivelse: "Fysikk 2 krever Fysikk 1"
      feilmelding: "For a velge Fysikk 2 ma du ha hatt Fysikk 1"

    - fag: "kjemi-2"
      krever: ["kjemi-1"]
      beskrivelse: "Kjemi 2 krever Kjemi 1"
      feilmelding: "For a velge Kjemi 2 ma du ha hatt Kjemi 1"

    - fag: "markedsforing-og-ledelse-2"
      krever: ["markedsforing-og-ledelse-1"]
      beskrivelse: "Markedsforing og ledelse 2 krever niva 1"
      feilmelding: "For a velge Markedsforing og ledelse 2 ma du ha hatt niva 1"

  eksklusjoner:
    - gruppe: ["matematikk-r1", "matematikk-r2", "matematikk-2p"]
      beskrivelse: "Kan ikke kombinere R-matte og 2P-matte"
      feilmelding: "Du kan ikke kombinere R-matematikk med 2P"

    - gruppe: ["matematikk-s1", "matematikk-s2", "matematikk-2p"]
      beskrivelse: "Kan ikke kombinere S-matte og 2P-matte"
      feilmelding: "Du kan ikke kombinere S-matematikk med 2P"

    - gruppe: ["matematikk-r1", "matematikk-r2", "matematikk-s1", "matematikk-s2"]
      beskrivelse: "Kan ikke kombinere R-matte og S-matte"
      feilmelding: "Du kan ikke kombinere R-matematikk med S-matematikk"

  erstatter:
    - fag: "matematikk-r1"
      erstatter: "matematikk-2p"
      beskrivelse: "Matematikk R1 erstatter 2P"
      timer-frigjort: 84

    - fag: "matematikk-s1"
      erstatter: "matematikk-2p"
      beskrivelse: "Matematikk S1 erstatter 2P"
      timer-frigjort: 84

# ========================================
# METADATA
# ========================================
metadata:
  versjon: "26-27_vedtatt"
  opprettet: "2026-01-06"
  sistOppdatert: "2026-01-08"
  basertPa: "blokkskjema.xlsx fra Bergen Private Gymnas"
  kommentar: |
    Vedtatt blokkskjema for skolearet 2026-2027 basert pa Excel-fil fra skolen.

    ENDRING 2026-01-08:
    - Fjernet Historie VG3 fra blokkskjemaet (obligatorisk fellesfag, handteres separat)
    - Alle 4 blokker er na tilgjengelige for VG3 (alle programomrader)
    - Blokk 1 VG3 har kun R2/S2 - elever uten disse velger fra blokk 2-4
    - Fjernet VG3-oppforinger for niva-1 fag (vises kun i VG2)

    BLOKKTILGANG:
    - Blokk 1: VG2 alle (Stud, Musikk, MK), VG3 kun Stud (R2/S2)
    - Blokk 2: VG2 kun Stud, VG3 alle (Stud, Musikk, MK)
    - Blokk 3: VG2 alle (Stud, Musikk, MK), VG3 Stud og MK
    - Blokk 4: VG2 kun Stud, VG3 kun Stud

    VG3-FAG MED FORUTSETNING:
    - Matematikk R2 (krever R1)
    - Matematikk S2 (krever S1)
    - Fysikk 2 (krever Fysikk 1)
    - Kjemi 2 (krever Kjemi 1)
    - Markedsforing og ledelse 2 (krever niva 1)

    VG3-FAG UTEN FORUTSETNING:
    - Biologi 2, Psykologi 2, Rettslaere 2
    - Entreprenorskap og bedriftsutvikling 2, Musikk fordypning 2
    - Okonomi og ledelse
    - Sosialkunnskap, Politikk og menneskerettigheter
    - Spansk I+II (betinget obligatorisk)
