# Bergen Private Gymnas - Blokkskjema 2026-2027 (Vedtatt)
# Sist oppdatert: 2026-01-06
# Basert på blokkskjema.xlsx fra skolen
#
# VIKTIGE PRINSIPPER:
# - Fag med * krever forutsetningsfag
# - Fag med ** er betinget obligatorisk (Spansk I+II)
# - Historie er obligatorisk VG3 og ligger i alle blokker
# - Blokktilgang per program er angitt i kolonneoverskrifter

school: bergen-private-gymnas
versjon: "26-27_vedtatt"

# ========================================
# STRUKTUR
# ========================================
struktur:
  antallBlokker: 4
  navnBlokker:
    - "Blokk 1"
    - "Blokk 2"
    - "Blokk 3"
    - "Blokk 4"

# ========================================
# BLOKKER - VALGFRIE PROGRAMFAG
# ========================================
blokker:
  # =====================================
  # BLOKK 1
  # VG2: Alle (Stud, Musikk, MK)
  # VG3: Kun Studiespesialisering
  # =====================================
  blokk1:
    navn: "Blokk 1"
    beskrivelse: "Matematikk"
    tilgjengeligFor:
      vg2: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
      vg3: ["studiespesialisering"]

    fag:
      # ===== VG2 FAG =====
      - id: matematikk-2p
        timer: 84
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Fellesfag som kan erstattes av R1 eller S1"

      - id: matematikk-s1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Erstatter Matematikk 2P hvis valgt"

      - id: matematikk-r1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Erstatter Matematikk 2P hvis valgt"

      # ===== VG3 FAG =====
      - id: matematikk-r2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]
        krever: ["matematikk-r1"]

      - id: matematikk-s2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]
        krever: ["matematikk-s1"]

      # ===== HISTORIE (obligatorisk VG3) =====
      - id: historie-vg3
        timer: 113
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering"]
        obligatorisk: true
        merknad: "OBLIGATORISK for alle VG3"

  # =====================================
  # BLOKK 2
  # VG2: Kun Studiespesialisering
  # VG3: Alle (Stud, Musikk, MK)
  # =====================================
  blokk2:
    navn: "Blokk 2"
    beskrivelse: "Realfag, Økonomi, Samfunnsfag, Kunst"
    tilgjengeligFor:
      vg2: ["studiespesialisering"]
      vg3: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]

    fag:
      # ===== VG2 FAG =====
      - id: kjemi-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: rettslaere-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: okonomistyring
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: samfunnsokonomi-1
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      - id: grafisk-design
        timer: 140
        trinn: vg2
        tilgjengeligFor: ["studiespesialisering"]

      # ===== VG3 FAG UTEN FORUTSETNING =====
      - id: kjemi-1
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Kan tas i VG3 hvis ikke tatt i VG2"

      - id: rettslaere-1
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Kan tas i VG3 hvis ikke tatt i VG2"

      - id: okonomistyring
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Kan tas i VG3 hvis ikke tatt i VG2"

      - id: samfunnsokonomi-1
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Kan tas i VG3 hvis ikke tatt i VG2"

      - id: grafisk-design
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Kan tas i VG3 hvis ikke tatt i VG2"

      - id: psykologi-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Bygger ikke på Psykologi 1"

      - id: entreprenorskap-og-bedriftsutvikling-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Bygger ikke på Entreprenorskap 1"

      - id: musikk-fordypning-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "Bygger ikke på Musikk fordypning 1"

      # ===== VG3 FAG MED FORUTSETNING =====
      - id: fysikk-2
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        krever: ["fysikk-1"]

      # ===== SPANSK I+II (betinget obligatorisk) =====
      - id: spansk-i-ii
        fagkode: FSP6237
        timer: 140
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        merknad: "BETINGET OBLIGATORISK for elever uten fremmedsprak fra ungdomsskolen"
        betingetObligatorisk: true
        betingelse: "Elev har ikke hatt fremmedsprak pa ungdomstrinnet"

      # ===== HISTORIE (obligatorisk VG3) =====
      - id: historie-vg3
        timer: 113
        trinn: vg3
        tilgjengeligFor: ["studiespesialisering", "musikk-dans-drama", "medier-kommunikasjon"]
        obligatorisk: true
        merknad: "OBLIGATORISK for alle VG3"

